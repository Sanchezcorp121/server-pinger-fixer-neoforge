license="${mod_license}"
issueTrackerURL="https://github.com/Sanchezcorp121/server-pinger-fixer-neoforge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Sanchezcorp121/server-pinger-fixer-neoforge"
logoFile="serverpingerfixer.png"
credits="Unofficial NeoForge port of Server Pinger Fixer by JustAlittleWolf."
description='''
Improves pinging speed of the multiplayer server list.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
